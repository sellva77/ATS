

services:
  postgres:
    image: postgres:17
    container_name: ats-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats123
      POSTGRES_DB: ats

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio

    container_name: ats-minio

    command: server /data --console-address ":9001"

    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

  ai-service:
    build:
      context: ../ai-service

    container_name: ats-ai

    restart: unless-stopped

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - minio

volumes:
  postgres_data:
  minio_data: