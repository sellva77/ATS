services:
  postgres:
    image: postgres:17
    container_name: ats-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats123
      POSTGRES_DB: ats

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: ats-minio

    command: server /data --console-address ":9001"

    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ats-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ai-service:
    build:
      context: ../ai-service
    container_name: ats-ai-service

    ports:
      - "8000:8000"

    env_file:
      - ../ai-service/.env
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

    volumes:
      - ../ai-service:/app

    depends_on:
      - minio
      - qdrant

  bff:
    build:
      context: ../BFF
    container_name: ats-bff
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"
    command: npm run dev
    volumes:
      - ../BFF:/app
      - /app/node_modules
    depends_on:
      - postgres
      - ai-service

  client:
    build:
      context: ../client
    container_name: ats-client
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    volumes:
      - ../client:/app
      - /app/node_modules
    depends_on:
      - bff

volumes:
  postgres_data:
  minio_data:
  qdrant_data: